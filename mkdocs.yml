site_name: Alplakes Data Assimilation
site_url: https://eawag-surface-waters-research.github.io/alplakes-data-assimilation/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

nav:
  - Home: index.md
  - Project Proposal: project-proposal.md
  - Tutorial: tutorial.md
  - Documentation:
      - Overview: workblog/overview.md
      - Method: workblog/method.md
      - Results: workblog/results.md
      - Experiments: workblog/experiments.md
      - Open problems: workblog/open-problems.md
      - Reference: workblog/reference.md
  - Configuration: configuration.md
  - Literature Review: literature-review.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.blocks.caption
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - assets/extra.css
